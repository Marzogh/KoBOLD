name: Deploy accepted installer
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag containing the accepted site ZIP
        required: true
      site_sha256:
        description: Reviewed SHA256 of KoBOLD-0.1.0-site.zip
        required: true
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Download the reviewed release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern 'KoBOLD-0.1.0-site.zip' --dir cache/download
      - name: Check archive, signatures and acceptance
        env:
          SITE_SHA256: ${{ inputs.site_sha256 }}
        run: |
          python3 tools/unpack_site.py cache/download/KoBOLD-0.1.0-site.zip cache/accepted-site "$SITE_SHA256"
          node tools/verify_site.mjs cache/accepted-site --production
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: cache/accepted-site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: false
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
